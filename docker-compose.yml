services:
  kids-control:
    build: .
    restart: unless-stopped
    ports:
      - "${KIDSCONTROL_BIND:-8000}:8000"
    env_file:
      - .env.docker
    environment:
      KIDSCONTROL_DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - kids-control-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kids-control-data:
